<div class="map-shell">
  <div id="oceanMap"></div>

  <div class="map-select" id="mapSelect">
    <div class="map-select-label">Select a map</div>
    <button class="map-select-pill" id="mapSelectPill">
      <span id="mapSelectLabel">Select a map</span>
      <svg class="msp-caret" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>

    <div class="map-select-dropdown" id="mapSelectDropdown">
      <!-- ================= CLIMATE ================= -->
      <div class="map-group" data-group="climate">
        <button class="map-group-head"><span class="mgh-title">Climate</span><svg class="mgh-caret" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="map-group-body">
          <button class="map-option" data-layer="sst">
            <div class="mo-title">Sea Surface Temperature</div>
            <div class="mo-sub">NOAA ERSSTv5 · real yearly grids, 1900-2025 · timeline</div>
          </button>
          <button class="map-option" data-layer="sealevel">
            <div class="mo-title">Sea Level Rise</div>
            <div class="mo-sub">NOAA tide gauges · real, 510 stations, 1900-2025 · timeline</div>
          </button>
          <button class="map-option" data-layer="seaice">
            <div class="mo-title">Sea Ice Concentration</div>
            <div class="mo-sub">NOAA/NSIDC (G02202 v6) · real, September 1979-2025 · timeline</div>
          </button>
          <button class="map-option" data-layer="acidity">
            <div class="mo-title">Ocean Acidity (pH)</div>
            <div class="mo-sub">GLODAPv2 climatology (Lauvset et al. 2016) · real, exact grid values</div>
          </button>
          <button class="map-option" data-layer="salinity">
            <div class="mo-title">Sea Surface Salinity</div>
            <div class="mo-sub">GLODAPv2 climatology (Lauvset et al. 2016) · real, exact grid values</div>
          </button>
        </div>
      </div>

      <!-- ================= ECOSYSTEMS ================= -->
      <div class="map-group" data-group="ecosystems">
        <button class="map-group-head"><span class="mgh-title">Ecosystems</span><svg class="mgh-caret" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="map-group-body">
          <button class="map-option" data-layer="mpa"><div class="mo-title">Marine Protected Areas</div><div class="mo-sub">24 major MPAs · 10 real traced boundaries (OSM) · Protected Planet/WDPA</div></button>
          <button class="map-option" data-layer="reef"><div class="mo-title">Coral Reef Extent</div><div class="mo-sub">130 real coral occurrence records · GBIF</div></button>
          <button class="map-option" data-layer="kelp"><div class="mo-title">Kelp &amp; Algae Forests</div><div class="mo-sub">130 real kelp occurrence records · GBIF</div></button>
          <button class="map-option" data-layer="mangrove"><div class="mo-title">Mangroves</div><div class="mo-sub">130 real mangrove occurrence records · GBIF</div></button>
          <button class="map-option" data-layer="saltmarsh"><div class="mo-title">Salt Marshes</div><div class="mo-sub">130 real salt marsh occurrence records · GBIF</div></button>
          <button class="map-option" data-layer="tidalflat"><div class="mo-title">Tidal Flats</div><div class="mo-sub">130 real tidal flat occurrence records · GBIF</div></button>
        </div>
      </div>

      <!-- ================= BIODIVERSITY ================= -->
      <div class="map-group" data-group="biodiversity">
        <button class="map-group-head"><span class="mgh-title">Biodiversity</span><svg class="mgh-caret" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="map-group-body">
          <button class="map-option" data-layer="birds"><div class="mo-title">Birds</div><div class="mo-sub">120 real GBIF records · 30 at-risk species</div></button>
          <button class="map-option" data-layer="reptiles"><div class="mo-title">Reptiles</div><div class="mo-sub">110 real GBIF records · 11 at-risk species</div></button>
          <button class="map-option" data-layer="mammals"><div class="mo-title">Mammals</div><div class="mo-sub">121 real GBIF records · 31 at-risk species</div></button>
        </div>
      </div>

      <!-- ================= SHIPPING ================= -->
      <div class="map-group" data-group="human-activity">
        <button class="map-group-head"><span class="mgh-title">Human Activity</span><svg class="mgh-caret" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="map-group-body">
          <button class="map-option" data-layer="ais"><div class="mo-title">Live Vessel Positions</div><div class="mo-sub">Real-time AIS · Digitraffic (Baltic &amp; Nordic waters)</div></button>
          <button class="map-option" data-layer="corridors"><div class="mo-title">Major Trade Corridors</div><div class="mo-sub">6 real global routes · reference only</div></button>
        </div>
      </div>
    </div>
  </div>

  <div class="map-bottom-bar" id="mapBottomBar">
    <div class="map-timeline" id="mapTimeline">
      <button class="timeline-play" title="Play" aria-label="Play timeline">
        <svg class="icon-play" viewBox="0 0 16 16" fill="none"><path d="M4 2.5v11l10-5.5-10-5.5Z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 16 16" fill="none"><path d="M4 2.5h2.6v11H4v-11Zm5.4 0H12v11H9.4v-11Z" fill="currentColor"/></svg>
      </button>
      <input type="range" id="timelineSlider" class="timeline-slider" min="0" max="1" step="1" value="0" aria-label="Timeline year" />
      <span class="timeline-year" id="timelineYearLabel"></span>
    </div>

    <div class="map-legend" id="mapLegend"></div>

    <div class="map-scenario-box" id="mapScenarioBox">
      <span class="map-scenario-title">Projected</span>
      <button class="scenario-btn" data-scenario="likely" title="Show a projected +2.0°C world" aria-label="Show a projected +2.0°C world">+2.0°C</button>
      <button class="scenario-btn" data-scenario="potential" title="Show a projected +3.0°C world" aria-label="Show a projected +3.0°C world">+3.0°C</button>
    </div>
  </div>

  <div class="map-toolbar" id="mapToolbar">
    <button id="screenshotBtn" title="Save a screenshot" aria-label="Save a screenshot"><svg viewBox="0 0 20 20" fill="none"><path d="M4 7h2.5L8 4.5h4L13.5 7H16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="11.5" r="2.6" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button id="adjustViewBtn" title="Adjust view" aria-label="Adjust view" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none"><path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <div class="map-toolbar-sep"></div>
    <button id="zoomInBtn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 20 20" fill="none"><path d="M10 5v10M5 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button id="zoomOutBtn" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 20 20" fill="none"><path d="M5 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>

  <div class="adjust-view-flyout" id="adjustViewFlyout">
    <h4>Adjust view</h4>
    <button class="avf-item" id="toggleProjectionBtn">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 10h15M10 2.5a11 11 0 0 1 0 15 11 11 0 0 1 0-15Z" stroke="currentColor" stroke-width="1.5"/></svg>
      <span id="toggleProjectionLabel">Show globe view</span>
    </button>
    <button class="avf-item" id="toggleBordersBtn">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 3l14 14M3 17 17 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2.5" y="2.5" width="15" height="15" rx="2" stroke="currentColor" stroke-width="1.3"/></svg>
      <span id="toggleBordersLabel">Hide country borders</span>
    </button>
    <button class="avf-item" id="tourBtn">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 16 3 5l5 2 4-2 5 2v11l-5-2-4 2-5-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>Take a quick tour</span>
    </button>
  </div>

  <div class="tour-caption" id="tourCaption">
    <div class="tour-text" id="tourText"></div>
    <div class="tour-controls">
      <button id="tourSkipBtn">Skip</button>
      <button id="tourNextBtn">Next</button>
    </div>
  </div>

  <div class="map-loading" id="mapLoading"><span class="spin"></span><span class="ml-text">Loading…</span></div>
</div>
